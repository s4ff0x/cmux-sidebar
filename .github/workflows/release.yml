# Pushing a v* tag publishes a GitHub Release whose assets are what users
# install: the sidebar file and the installer. `releases/latest/download/...`
# always points at the newest non-prerelease release.
#
# The test suite needs cmux's SidebarRuntime.js from the macOS app, so it runs
# locally before tagging (see README, Releasing); CI only checks syntax.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/cmux-sidebar.js && sh -n install.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            src/cmux-sidebar.js install.sh \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
